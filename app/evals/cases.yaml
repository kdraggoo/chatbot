# Golden question set for the resume chatbot.
#
# Each case:
#   id        unique, stable name (used to compare runs)
#   query     the question, as a visitor would ask it
#   tags      for filtering with --tag and for the per-tag summary
#   facts     strings the answer should contain (case-insensitive). An item that
#             is a list means "any one of these". Every fact must appear verbatim
#             in at least one document in data/, so retrieval can be checked too.
#   min_facts how many facts must be found to pass (default: all of them)
#   refuse    true when the knowledge base can't answer and the bot should say so
#   forbid    strings that must NOT appear in the answer (hallucination guards)
#
# Ground truth comes from data/, mainly "Kevin - Career.md" (built 2026-10-04 from the
# original resumes and Kevin's fact-check answers) and "DRAGGOO KEVIN (3314-B) ATS v2.pdf".

# --- Employment history ---------------------------------------------------

- id: employers-where
  query: Where has Kevin worked?
  tags: [employment]
  facts: [Rocket, Webgility, Infor, Draggoo Consulting, CLM]
  min_facts: 3

- id: employers-list
  query: List Kevin's historical employers.
  tags: [employment, list]
  facts: [Rocket, Webgility, Infor, CLM, MTI, Draggoo Consulting]
  min_facts: 4

- id: current-role
  query: What is Kevin doing now?
  tags: [employment]
  facts: [[Draggoo Consulting, founder]]

- id: rocket-dates
  query: When did Kevin work at Rocket Mortgage?
  tags: [employment, dates]
  facts: ["2020", "2023"]

- id: rocket-title
  query: What was Kevin's job title at Rocket?
  tags: [employment]
  facts: [Digital Product Manager]

# Rocket Central was the employer, part of the Rocket Mortgage family (Kevin, 2026-10-04).
# Resumes write "Rocket Central (Rocket Mortgage)", which the model read as a correction.
- id: rocket-central
  query: Did Kevin work for Rocket Central?
  tags: [employment, attribution]
  facts: [Rocket Central]
  forbid: [not Rocket Central, did not work for Rocket Central, didn't work for Rocket Central, never worked]

- id: rocket-savings
  query: How did Kevin save money at Rocket Mortgage?
  tags: [achievements]
  facts: [[$100K, 100K, "$100,000", "100,000"], [80%, 80 percent, Splunk]]
  min_facts: 1

- id: webgility-team
  query: How big was the team Kevin led at Webgility?
  tags: [leadership]
  facts: [["30-person", "30 person", "30 people", "30-member", " 30 "]]

- id: webgility-partners
  query: What partnerships did Kevin build at Webgility?
  tags: [achievements]
  facts: [Amazon, eBay, Avalara, Intuit]
  min_facts: 2

- id: infor-team
  query: How many people did Kevin lead at Infor?
  tags: [leadership]
  facts: ["150"]

- id: infor-results
  query: What results did Kevin achieve at Infor?
  tags: [achievements, attribution]
  facts: [[48%, 48 percent], [35%, 35 percent], [Gartner, Forrester, leader quadrant]]
  min_facts: 2
  # Webgility results that chunks spanning both jobs used to pass off as Infor's,
  # and Rocket/consulting results that MMR at 0.7 pulled in and the live API credited to Infor
  forbid: [60%, first-call, four major products, 4 major products, "1,272", voter, time card]

- id: clm-product
  query: What did Kevin do at The CLM Group?
  tags: [employment]
  facts: [[POS, point of sale, point-of-sale], [K12, K-12, school]]

- id: consulting-projects
  query: What kind of projects does Draggoo Consulting take on?
  tags: [employment]
  facts: [[political, campaign], [VR, virtual reality, game], [non-profit, nonprofit]]
  min_facts: 2

# --- Experience and skills --------------------------------------------------

- id: pm-tenure
  query: How long has Kevin been in product management?
  tags: [experience, probe]
  facts: [["15+", "15 years", "fifteen"]]

# Direct reports were at Webgility (2, plus mentoring the India team). The larger
# Infor teams were cross-functional; one resume's "150+ direct reports" overstates it.
- id: management
  query: Does Kevin have direct management experience?
  tags: [leadership, probe]
  facts: [["2 direct reports", "two direct reports", "2 direct", "two direct"], Webgility]
  forbid: ["150+ direct reports", "150 direct reports"]

- id: ai-skill
  query: What is Kevin's skill level with AI?
  tags: [skills, probe]
  facts: [[generative AI, GenAI], [NLP, natural language, machine learning], [ChatGPT, OpenAI]]
  min_facts: 1

- id: board
  query: Has Kevin served on any boards?
  tags: [leadership, volunteer]
  facts: [[HOA, Finley Farms, homeowners]]

# --- Volunteer and community work --------------------------------------------
# Spread thinly across resumes from different years, like the board role: Habitat
# for Humanity, Rotary and Boy Scouts (2009-2011 resumes), PDMA Arizona president
# (2013-14), school PTO VP and co-president (2014-16), HOA board (2019-22), and
# "political campaigns, mentoring, non-profit board roles" (ATS resume). Facts are
# words the question doesn't contain, so echoing the question can't pass.

- id: volunteer
  query: Has Kevin done any volunteer work?
  tags: [volunteer]
  facts: [[Habitat], [Rotary], [Boy Scouts, Scouts], [PTO], [PDMA], [HOA, Finley Farms, homeowners], [political campaign]]
  min_facts: 2

- id: nonprofit
  query: Any nonprofit involvement?
  tags: [volunteer]
  facts: [[Habitat, Rotary, Boy Scouts, PDMA, PTO], [bylaws, by-laws, codes of conduct, governance]]
  min_facts: 1

- id: community
  query: Is Kevin involved in his community?
  tags: [volunteer]
  facts: [[HOA, Finley Farms, homeowners], [PTO, Imagine West Gilbert], [Rotary, Habitat, Boy Scouts]]
  min_facts: 1

- id: outside-leadership
  query: Has Kevin held any leadership roles outside of work?
  tags: [volunteer, leadership]
  facts: [[HOA, Finley Farms, homeowners], [PTO], [PDMA]]
  min_facts: 1

- id: professional-association
  query: Has Kevin been involved in any professional associations?
  tags: [volunteer]
  facts: [[PDMA, Product Development and Management Association]]

- id: school-volunteer
  query: Has Kevin volunteered at a school?
  tags: [volunteer]
  facts: [[PTO, Imagine West Gilbert]]

- id: hoa-dates
  query: When was Kevin on the HOA board?
  tags: [volunteer, dates]
  facts: ["2019"]

- id: boy-scouts
  query: What did Kevin do for the Boy Scouts?
  tags: [volunteer]
  facts: [[computer, network]]

