<!-- /srv/chatbot/app/admin.html -->
<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Admin - Chatbot Ingestion</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			
			body {
				font-family: 'Courier New', monospace;
				background: #0a0a0a;
				color: #00ff41;
				height: 100vh;
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}
			
			.header {
				padding: 1rem;
				border-bottom: 1px solid #ffaa00;
				background: #000;
			}
			
			.header h1 {
				font-size: 1.2rem;
				text-shadow: 0 0 10px #ffaa00;
				letter-spacing: 2px;
				color: #ffaa00;
			}
			
			.header p {
				font-size: 0.8rem;
				color: #ff8800;
				margin-top: 0.5rem;
				opacity: 0.8;
			}
			
			#chatContainer {
				flex: 1;
				overflow-y: auto;
				padding: 1rem;
				background: #000;
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}
			
			#chatContainer::-webkit-scrollbar {
				width: 8px;
			}
			
			#chatContainer::-webkit-scrollbar-track {
				background: #0a0a0a;
			}
			
			#chatContainer::-webkit-scrollbar-thumb {
				background: #ffaa00;
				border-radius: 4px;
			}
			
			.message {
				display: flex;
				flex-direction: column;
				max-width: 80%;
				animation: fadeIn 0.3s ease-in;
			}
			
			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(10px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
			
			.message.user {
				align-self: flex-end;
				align-items: flex-end;
			}
			
			.message.bot {
				align-self: flex-start;
				align-items: flex-start;
			}
			
			.message-label {
				font-size: 0.7rem;
				color: #ff8800;
				margin-bottom: 0.25rem;
				text-transform: uppercase;
				letter-spacing: 1px;
			}
			
			.message-content {
				padding: 0.75rem 1rem;
				border-radius: 8px;
				white-space: pre-wrap;
				word-wrap: break-word;
				line-height: 1.5;
			}
			
			.message.user .message-content {
				background: #331100;
				border: 1px solid #ffaa00;
				color: #ffaa00;
				box-shadow: 0 0 5px rgba(255, 170, 0, 0.3);
			}
			
			.message.bot .message-content {
				background: #221100;
				border: 1px solid #ff8800;
				color: #ffaa00;
				box-shadow: 0 0 5px rgba(255, 136, 0, 0.2);
			}
			
			.message.success .message-content {
				background: #113300;
				border-color: #00ff41;
				color: #00ff41;
			}
			
			.message.typing .message-content {
				color: #ff8800;
			}
			
			.message.error .message-content {
				background: #330000;
				border-color: #ff0041;
				color: #ff6666;
				box-shadow: 0 0 5px rgba(255, 0, 65, 0.3);
			}
			
			.typing-indicator {
				display: inline-block;
				animation: typingPulse 1.5s ease-in-out infinite;
			}
			
			@keyframes typingPulse {
				0%, 100% { opacity: 1; }
				50% { opacity: 0.3; }
			}
			
			.input-area {
				padding: 1rem;
				border-top: 1px solid #ffaa00;
				background: #000;
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}
			
			.input-row {
				display: flex;
				gap: 0.5rem;
			}
			
			#q {
				flex: 1;
				padding: 0.75rem;
				font-size: 1rem;
				font-family: 'Courier New', monospace;
				background: #0a0a0a;
				border: 1px solid #ffaa00;
				border-radius: 4px;
				color: #ffaa00;
				outline: none;
				min-height: 100px;
				resize: vertical;
			}
			
			#q:focus {
				box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
			}
			
			#q::placeholder {
				color: #664400;
			}
			
			.meta-inputs {
				display: flex;
				gap: 0.5rem;
			}
			
			.meta-inputs input {
				flex: 1;
				padding: 0.5rem;
				font-size: 0.9rem;
				font-family: 'Courier New', monospace;
				background: #0a0a0a;
				border: 1px solid #ff8800;
				border-radius: 4px;
				color: #ffaa00;
				outline: none;
			}
			
			.meta-inputs input::placeholder {
				color: #664400;
			}
			
			#go {
				padding: 0.75rem 1.5rem;
				font-size: 1rem;
				font-family: 'Courier New', monospace;
				background: #331100;
				color: #ffaa00;
				border: 1px solid #ffaa00;
				border-radius: 4px;
				cursor: pointer;
				text-transform: uppercase;
				letter-spacing: 1px;
				transition: all 0.2s;
			}
			
			#go:hover:not(:disabled) {
				background: #442200;
				box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
			}
			
			#go:disabled {
				background: #110000;
				border-color: #664400;
				color: #664400;
				cursor: not-allowed;
			}
			
			.empty-state {
				text-align: center;
				color: #664400;
				padding: 2rem;
				font-style: italic;
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>// ADMIN - KNOWLEDGE BASE INGESTION</h1>
			<p>Enter text content to ingest into the knowledge base. Content will be chunked, embedded, and stored.</p>
			<div id="authStatus" style="margin-top: 0.5rem; font-size: 0.75rem; color: #ff8800;"></div>
		</div>
		<div id="chatContainer"></div>
		<div class="input-area">
			<div id="apiKeySection" style="margin-bottom: 0.5rem; padding: 0.5rem; background: #110000; border: 1px solid #664400; border-radius: 4px; display: none;">
				<label style="display: block; font-size: 0.8rem; color: #ff8800; margin-bottom: 0.25rem;">API Key (required for authentication):</label>
				<input type="password" id="apiKey" placeholder="Enter admin API key..." autocomplete="off" style="width: 100%; padding: 0.5rem; font-size: 0.9rem; font-family: 'Courier New', monospace; background: #0a0a0a; border: 1px solid #ff8800; border-radius: 4px; color: #ffaa00; outline: none;">
				<button id="saveApiKey" style="margin-top: 0.5rem; padding: 0.5rem 1rem; font-size: 0.85rem; font-family: 'Courier New', monospace; background: #331100; color: #ffaa00; border: 1px solid #ffaa00; border-radius: 4px; cursor: pointer;">Save & Continue</button>
			</div>
			<div class="meta-inputs">
				<input id="title" placeholder="Title (optional)" autocomplete="off">
				<input id="source" placeholder="Source identifier (optional)" autocomplete="off">
			</div>
			<div class="input-row">
				<textarea id="q" placeholder="Enter content to ingest... (supports multi-line text)" autocomplete="off"></textarea>
				<button id="go">INGEST</button>
			</div>
		</div>
		<script src="./admin.js"></script>
	</body>
</html>
