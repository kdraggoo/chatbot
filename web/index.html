<!-- /srv/chatbot/web/index.html -->
<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Chatbot</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			
			body {
				font-family: 'Courier New', monospace;
				background: #0a0a0a;
				color: #00ff41;
				height: 100vh;
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}
			
			.header {
				padding: 1rem;
				border-bottom: 1px solid #00ff41;
				background: #000;
			}
			
			.header h1 {
				font-size: 1.2rem;
				text-shadow: 0 0 10px #00ff41;
				letter-spacing: 2px;
			}
			
			.header p {
				font-size: 0.8rem;
				color: #00cc33;
				margin-top: 0.5rem;
				opacity: 0.8;
			}
			
			#chatContainer {
				flex: 1;
				overflow-y: auto;
				padding: 1rem;
				background: #000;
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}
			
			#chatContainer::-webkit-scrollbar {
				width: 8px;
			}
			
			#chatContainer::-webkit-scrollbar-track {
				background: #0a0a0a;
			}
			
			#chatContainer::-webkit-scrollbar-thumb {
				background: #00ff41;
				border-radius: 4px;
			}
			
			.message {
				display: flex;
				flex-direction: column;
				max-width: 80%;
				animation: fadeIn 0.3s ease-in;
			}
			
			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(10px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
			
			.message.user {
				align-self: flex-end;
				align-items: flex-end;
			}
			
			.message.bot {
				align-self: flex-start;
				align-items: flex-start;
			}
			
			.message-label {
				font-size: 0.7rem;
				color: #00cc33;
				margin-bottom: 0.25rem;
				text-transform: uppercase;
				letter-spacing: 1px;
			}
			
			.message-content {
				padding: 0.75rem 1rem;
				border-radius: 8px;
				white-space: pre-wrap;
				word-wrap: break-word;
				line-height: 1.5;
			}
			
			.message.user .message-content {
				background: #003311;
				border: 1px solid #00ff41;
				color: #00ff41;
				box-shadow: 0 0 5px rgba(0, 255, 65, 0.3);
			}
			
			.message.bot .message-content {
				background: #001100;
				border: 1px solid #00cc33;
				color: #00ff41;
				box-shadow: 0 0 5px rgba(0, 204, 51, 0.2);
			}
			
			.message.typing .message-content {
				color: #00cc33;
			}
			
			.message.error .message-content {
				background: #330000;
				border-color: #ff0041;
				color: #ff6666;
				box-shadow: 0 0 5px rgba(255, 0, 65, 0.3);
			}
			
			.typing-indicator {
				display: inline-block;
				animation: typingPulse 1.5s ease-in-out infinite;
			}
			
			@keyframes typingPulse {
				0%, 100% { opacity: 1; }
				50% { opacity: 0.3; }
			}
			
			.input-area {
				padding: 1rem;
				border-top: 1px solid #00ff41;
				background: #000;
				display: flex;
				gap: 0.5rem;
			}
			
			#q {
				flex: 1;
				padding: 0.75rem;
				font-size: 1rem;
				font-family: 'Courier New', monospace;
				background: #0a0a0a;
				border: 1px solid #00ff41;
				border-radius: 4px;
				color: #00ff41;
				outline: none;
			}
			
			#q:focus {
				box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
			}
			
			#q::placeholder {
				color: #006622;
			}
			
			#go {
				padding: 0.75rem 1.5rem;
				font-size: 1rem;
				font-family: 'Courier New', monospace;
				background: #003311;
				color: #00ff41;
				border: 1px solid #00ff41;
				border-radius: 4px;
				cursor: pointer;
				text-transform: uppercase;
				letter-spacing: 1px;
				transition: all 0.2s;
			}
			
			#go:hover:not(:disabled) {
				background: #004422;
				box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
			}
			
			#go:disabled {
				background: #001100;
				border-color: #006622;
				color: #006622;
				cursor: not-allowed;
			}
			
			.empty-state {
				text-align: center;
				color: #006622;
				padding: 2rem;
				font-style: italic;
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>// CHATBOT INTERFACE</h1>
			<p>Ask any question about Kevin's employment history. Press Enter or click SEND to submit.</p>
		</div>
		<div id="chatContainer"></div>
		<div class="input-area">
			<input id="q" placeholder="Type your message..." autocomplete="off">
			<button id="go">SEND</button>
		</div>
		<script src="./app.js"></script>
	</body>
</html>
