<!-- /srv/chatbot/web/index.html -->
<!doctype html>
<html data-theme="ios">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>Chatbot</title>
		<script>
			// Apply the saved theme before first paint (app.js handles the picker)
			(function () {
				var themes = ['retro', 'ios', 'android', 'contrast', 'ironman', 'american', 'canadian', 'synthwave'], theme = null;
				try { theme = new URLSearchParams(location.search).get('theme'); } catch (e) {}
				if (themes.indexOf(theme) < 0) {
					try { theme = localStorage.getItem('chatbot-theme'); } catch (e) {}
				}
				if (themes.indexOf(theme) >= 0) {
					document.documentElement.setAttribute('data-theme', theme);
				}
			})();
		</script>
		<link rel="stylesheet" href="./base.css?v=5">
		<link rel="stylesheet" href="./themes/retro.css?v=8">
		<link rel="stylesheet" href="./themes/ios.css?v=8">
		<link rel="stylesheet" href="./themes/android.css?v=8">
		<link rel="stylesheet" href="./themes/contrast.css?v=8">
		<link rel="stylesheet" href="./themes/ironman.css?v=8">
		<link rel="stylesheet" href="./themes/american.css?v=8">
		<link rel="stylesheet" href="./themes/canadian.css?v=8">
		<link rel="stylesheet" href="./themes/synthwave.css?v=8">
	</head>
	<body>
		<div class="header">
			<div class="header-main">
				<div class="avatar" id="avatar" aria-hidden="true">KD</div>
				<h1 id="title">Kevin's Resume Bot</h1>
				<p id="subtitle">Ask any question about Kevin's employment history.</p>
			</div>
			<div class="theme-picker">
				<a class="stats-link" href="./stats/">Stats</a>
				<label for="theme">Theme</label>
				<select id="theme">
					<option value="retro">Retro</option>
					<option value="ios">iOS</option>
					<option value="android">Android</option>
					<option value="contrast">High Contrast</option>
					<option value="ironman">Iron Man</option>
					<option value="american">American</option>
					<option value="canadian">Canadian</option>
					<option value="synthwave">Synthwave</option>
				</select>
			</div>
		</div>
		<div id="chatContainer"></div>
		<div class="input-area">
			<input id="q" placeholder="iMessage" autocomplete="off">
			<button id="go" aria-label="Send">&#8593;</button>
		</div>
		<script src="./app.js?v=4"></script>
	</body>
</html>
